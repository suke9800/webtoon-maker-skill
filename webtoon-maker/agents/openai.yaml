interface:
  display_name: "웹툰 메이커"
  short_description: "직접 그린 배치 콘티를 승인받고 글까지 한 번에 세로 웹툰 제작"
  default_prompt: "$webtoon-maker 아래 내용을 세로 웹툰으로 만들어줘. 분량이 없으면 사건 사이 연결을 계산해 원하는 파트 수만 물어봐. 전 파트의 원인·인물의 앎과 목표·선택·결과를 잇고, 대사마다 계기·목적·상대 반응을 확정한 뒤 극본과 시각 콘티를 만들어 승인받아. 콘티에서 컷 크기·스크롤 공개·카메라·인물 동선·정확한 대사·상황에 맞는 말풍선의 자리와 디자인을 결정해. 승인 후 현재 화풍 레퍼런스를 인물과 모든 배경·재질에 직접 적용하고, 파트별 통합 이미지에서 장면·컷·말풍선·대사·효과음을 동시에 완성해. 세부 제작 규칙은 SKILL.md와 references/art-direction.md를 따라줘."

