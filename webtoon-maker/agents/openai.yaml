interface:
  display_name: "웹툰 메이커"
  short_description: "파트별 글 콘티를 승인받고 대사까지 한 번에 세로 웹툰 제작"
  default_prompt: "$webtoon-maker 아래 내용을 세로 웹툰으로 만들어줘. 분량이 없으면 사건 사이 연결을 계산해 원하는 파트 수만 물어봐. 첫 파트의 장르에 맞는 세계관·상황 인트로와 전 파트의 기승전결, 대사마다 계기·목적·상대 반응을 확정해. 콘티용 그림이나 배치도 없이 파트별 글 콘티에 스크롤 전환·컷 크기 대비·카메라·동선·정확한 대사·말풍선 디자인과 해당 파트의 상세 화풍 지시를 써서 승인받아. 승인 후 매 파트에 현재 화풍 이미지를 직접 참조해 인물·배경·재질을 같은 귀여운 2D 그림체로 그리고, 한 파트의 통합 이미지에서 컷·대사·말풍선·효과음을 함께 완성해. 세부 제작 규칙은 SKILL.md와 references/art-direction.md를 따라줘."

