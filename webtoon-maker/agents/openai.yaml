interface:
  display_name: "웹툰 메이커"
  short_description: "직접 그린 배치 콘티를 승인받고 글까지 한 번에 세로 웹툰 제작"
  default_prompt: "$webtoon-maker 아래 내용을 세로 웹툰으로 만들어줘. 분량이 없으면 연결 장면을 계산해 원하는 파트 수만 먼저 물어봐. 극본·공간·확정 대사와 인물 기준 그림을 준비하고, 이미지 생성 도구 없이 네가 직접 컷 배치·카메라·인물 거리·스크롤·대사 여유 공간을 그린 시각 콘티를 만들어 승인받아. 콘티에 완성형 흰 말풍선을 미리 그리지 마. 승인 후 콘티는 구도 안내로만, 현재 style-reference.png는 웹툰 전체의 인물·배경·건축·옷감·소품·재질 모두의 화풍 참조로 매 파트 직접 사용해. 현재 기준의 귀여운 2D 선·둥근 비율·밝은 색면·단순한 재질을 전부에 적용하고 실사·3D·사진 질감은 쓰지 마. 각 파트의 첫 본편 이미지 생성에서 장면·컷·인물·배경·감정·거리·음량에 맞춰 선·면·꼬리를 달리한 세련된 말풍선·정확한 한국어 대사·독백·효과음을 한 번에 함께 만들어줘. 글 없는 선행 이미지, 빈 풍선, 생성 뒤 풍선이나 글 덧씌우기, 낱장 삽화 쌓기는 하지 마. 파트별 컷 수는 장면에 따라 정해줘."

