interface:
  display_name: "웹툰 메이커"
  short_description: "파트별 글 콘티를 승인받고 대사까지 한 번에 세로 웹툰 제작"
  default_prompt: "$webtoon-maker 아래 내용을 세로 웹툰으로 만들어줘. 분량이 없으면 사건 사이 연결을 계산해 원하는 파트 수만 물어봐. 첫 파트의 장르에 맞는 세계관·상황 인트로와 전 파트의 기승전결, 대사마다 계기·목적·상대 반응을 확정해. 콘티용 그림이나 배치도 없이 파트별 글 콘티에 '《신의 탑》처럼 컷 연출과 구도를 설계해 줘'라는 기준을 직접 쓰고, 그 파트의 카메라 시점·인물 크기와 위치·전경/배경·작은 컷과 스크롤을 지배하는 긴 대형 화면·전조와 잔향·효과선/효과음·여백·공개 순서·말풍선 경로를 구체적으로 명시해 승인받아. 승인 후 매 파트의 본편 요청에도 그 기준과 구체적 연출을 쓰고, 현재 화풍 이미지를 직접 참조해 인물·배경·재질을 같은 짙은 잉크선·매트한 셀 채색의 2D 그림체로 그려. 한 파트의 통합 이미지에서 컷·대사·말풍선·효과음을 함께 완성해. 세부 제작 규칙은 SKILL.md와 references/art-direction.md를 따라줘."

